general {
	output_format = i3bar
	interval = 10 # seconds
	markup = "pango"

	colors = true
	color_degraded = "#FFFF00"
	color_bad = "#FF0000"

	separator = ""
	#separator = "|"
	#color_separator = "#d0d0d0" # does not work with i3bar
}

order += "disk /"
order += memory
order += cpu_usage
order += "tztime local"

disk "/" {
	format = "<big>Disk: %percentage_free Free</big>"
	low_threshold = 5
	threshold_type = percentage_free
	format_below_threshold = "<big>Disk Warning: %percentage_free</big>"
}

memory {
	format = "<big>Mem: %used (%percentage_used)</big>"
	threshold_degraded = "10%"
	threshold_critical = "5%"
	format_degraded = "<big>Mem Warning: %used (%percentage_used)</big>"
}

cpu_usage {
	format = "<big>CPU: %usage</big>"
	degraded_threshold = 80
	max_threshold = 95
	format_above_threshold = "<big>CPU Warning: %usage</big>"
	format_above_degraded_threshold = "<big>CPU Warning: %usage</big>"
}

tztime local {
	format = "<big>%Y-%m-%d %H:%M</big>"
}

